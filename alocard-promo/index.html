<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AloCard — 30s promo · 9:16</title>
<style>
  @font-face {
    font-family: 'Archivo';
    src: url('fonts/archivo-var-latin.woff2') format('woff2-variations');
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  html, body { margin: 0; background: #f4f1ea; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module" src="./preview.js"></script>
<script type="module">
// AloCard 30s · 9:16 · minimal-ui 产品宣传片（真实品牌素材版）
// hook(0-4s) 三卡扇出+提问 → reveal(4-8s) 真实首页亮相 → sell-sort(8-14s) 免息期排序
// → sell-count(14-20s) 还款倒计时账簿格带 → sell-priv(20-24s) 真实锁屏·卡号加密
// → recap(24-26s) 真实小组件汇总 → endcard(26-30s) 真实 logo 落版
import { DUR, b, BEAT, SHOTS } from './timeline.js';
import { TAU, clamp, lerp, seg, spring, springTo, pulse, ease, snap, glide, stageSize, setupCanvas, camera, loadFonts, loadImage, rgba, shake } from './motion.js';

const { W, H } = stageSize();
const ctx = setupCanvas(document.getElementById('c'), W, H);
const U = Math.min(W, H) / 1080;

// ── real brand（来自真实 App 截图与 logo 采样）──
const PAPER = '#f4f1ea', RAISED = '#ffffff', SUNKEN = '#ece9e0';
const INK = '#1c1b19', INK2 = '#4a4842', INK3 = '#5f5c55', RULE = '#dcd8cc';
const GOLD = '#e3b23a';                       // 采样自 logo-gold.png
const GOLD_DEEP = '#c9992e';                  // 小字/描边加深，保证纸面对比
const PERSIMMON = '#a84f34', GREY_TAB = '#b7b1a2';
const DARKCARD = '#171614';                   // 真实信用卡深炭面
const A = (size, weight = 800) => `${weight} ${size}px "Archivo","Microsoft YaHei",sans-serif`;

function dotGrid(sp = 48 * U, r = 1.6 * U, col = 'rgba(28,27,25,0.06)') {
  ctx.fillStyle = col;
  for (let y = sp / 2; y < H; y += sp) for (let x = sp / 2; x < W; x += sp) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function txt(s, x, y, font, col, align = 'left', baseline = 'alphabetic') {
  ctx.font = font; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = baseline; ctx.fillText(s, x, y);
}
function shadow(fn, blur, dy, col) { ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = blur; ctx.shadowOffsetY = dy; fn(); ctx.restore(); }
const countUp = (t, t0, val, dur = 0.55) => Math.round(val * ease.outCubic(seg(t, t0, t0 + dur)));
function wipe(draw, x, y, w, k) {
  ctx.save(); ctx.beginPath(); ctx.rect(x - 8 * U, y - 200 * U, (w + 16 * U) * clamp(k), 400 * U); ctx.clip(); draw(); ctx.restore();
}
/** 真实截图绘入手机屏（圆角裁剪），返回内容区矩形 */
function shotInPhone(img, sx, sy, sw, sh, dx, dy, dw, dh, rad = 0) {
  ctx.save(); rr(dx, dy, dw, dh, rad); ctx.clip();
  ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
  ctx.restore();
}

// ── shared geometry ──
const PX = 90 * U, PW = 900 * U, PR = 36 * U, IX = PX + 48 * U, IW = PW - 96 * U;
const RH = 240 * U, RGAP = 28 * U;
const PY = 380 * U, PH = 1180 * U;
const rowY = j => PY + 250 * U + j * (RH + RGAP);
// 真实银行与免息期（来自小组件截图：49/46/45；尾号为示意脱敏）
const CARDS = [
  { bank: '民生银行', card: '标准白金 ·••• 2319', days: 49, hot: true },
  { bank: '光大银行', card: '阳光白金 ·••• 8776', days: 46, hot: false },
  { bank: '华夏银行', card: '精英尊尚 ·••• 1177', days: 45, hot: false },
];
const arrivalSlot = [2, 1, 0]; // 到达顺序：华夏→光大→民生（未排序）

// ═══ HOOK 0–4s · 三张真实风格深炭卡 ═══
function drawHook(t) {
  const q = '今天刷哪张？';
  [...q].forEach((ch, i) => {
    const k = spring(t - (b(0.4) + i * 0.055), { freq: 2.2, damp: 0.6 });
    ctx.save(); ctx.translate(0, (1 - k) * 90 * U);
    txt(ch, W / 2 + (i - (q.length - 1) / 2) * 118 * U, 430 * U, A(108 * U, 800), INK, 'center');
    ctx.restore();
  });
  wipe(() => txt('三张卡 · 三个账单日', W / 2, 530 * U, A(38 * U, 500), INK3, 'center'), W / 2 - 220 * U, 530 * U, 440 * U, snap(seg(t, b(2.2), b(3.4))));

  const kFan = spring(t - b(1), { freq: 1.8, damp: 0.7 });
  const kOut = snap(seg(t, b(7), b(8.4)));
  CARDS.forEach((c, i) => {
    const slot = arrivalSlot[i];
    const rot = (slot - 1) * 0.17 * kFan, dx = (slot - 1) * 190 * U * kFan, dy = Math.abs(slot - 1) * 46 * U * kFan;
    ctx.save();
    ctx.translate(W / 2 + dx, 1150 * U + dy + kOut * 620 * U);
    ctx.rotate(rot + kOut * (slot - 1) * 0.1);
    ctx.translate(-280 * U, -175 * U);
    ctx.globalAlpha = 1 - kOut;
    // 深炭信用卡（同真实 App 卡面）
    shadow(() => { ctx.fillStyle = DARKCARD; rr(0, 0, 560 * U, 350 * U, 28 * U); ctx.fill(); }, 50 * U, 18 * U, 'rgba(28,27,25,0.28)');
    txt(c.bank, 36 * U, 92 * U, A(36 * U, 700), '#f7f6f2');
    txt('信用卡', 36 * U, 132 * U, A(24 * U, 500), rgba('#f7f6f2', 0.5));
    // 金色 chip
    ctx.fillStyle = GOLD; rr(428 * U, 56 * U, 96 * U, 72 * U, 12 * U); ctx.fill();
    ctx.strokeStyle = rgba(DARKCARD, 0.55); ctx.lineWidth = 2 * U;
    ctx.beginPath(); ctx.moveTo(428 * U, 92 * U); ctx.lineTo(524 * U, 92 * U); ctx.moveTo(476 * U, 56 * U); ctx.lineTo(476 * U, 128 * U); ctx.stroke();
    txt('•••• •••• •••• ' + c.card.slice(-4), 36 * U, 232 * U, A(38 * U, 600), rgba('#f7f6f2', 0.92));
    txt('免息期', 380 * U, 296 * U, A(26 * U, 500), rgba('#f7f6f2', 0.5));
    txt('? 天', 524 * U, 300 * U, A(44 * U, 800), GOLD, 'right');
    ctx.restore();
  });
}

// ═══ APP reveal(真实截图)+sell-sort 4–14s ═══
function drawRow(c, i, t) {
  const slot = arrivalSlot[i];
  const kIn = spring(t - (b(16) + slot * 0.09), { freq: 2.4, damp: 0.75 });
  const kSwap = snap(seg(t, b(19), b(20.5)));
  const neutral = t < b(17) + i * 0.1;
  const yy = lerp(rowY(slot), rowY(i), kSwap) + (1 - kIn) * 140 * U;
  const hotK = c.hot ? snap(seg(t, b(20.2), b(21.2))) : 0;
  const lift = c.hot ? pulse(t, b(20), 0.3) * 6 * U : 0;
  ctx.save();
  if (neutral) {
    ctx.fillStyle = SUNKEN; rr(IX, yy, IW, RH, 16 * U); ctx.fill();
    ctx.fillStyle = GREY_TAB; ctx.fillRect(IX, yy, 10 * U, RH);
    txt(c.bank, IX + 40 * U, yy + 72 * U, A(36 * U, 600), INK2);
    txt(c.card, IX + 40 * U, yy + 128 * U, A(26 * U, 400), INK3);
    const fT0 = A(38 * U, 500), fN0 = A(96 * U, 800);
    ctx.font = fT0; const wT0 = ctx.measureText('天').width + 10 * U;
    txt('天', IX + IW - 36 * U, yy + RH / 2 + 8 * U, fT0, INK3, 'right', 'middle');
    txt('--', IX + IW - 36 * U - wT0, yy + RH / 2 + 8 * U, fN0, rgba(INK3, 0.65), 'right', 'middle');
    txt('免息期', IX + IW - 36 * U, yy + 52 * U, A(24 * U, 400), INK3, 'right');
  } else if (c.hot) {
    shadow(() => { ctx.fillStyle = RAISED; rr(IX, yy - lift, IW, RH, 20 * U); ctx.fill(); }, 44 * U, 14 * U, `rgba(201,153,46,${0.28 * hotK})`);
    ctx.strokeStyle = rgba(GOLD_DEEP, 0.6 * hotK); ctx.lineWidth = 2 * U; rr(IX, yy - lift, IW, RH, 20 * U); ctx.stroke();
    ctx.fillStyle = GOLD; ctx.fillRect(IX, yy - lift, 12 * U * hotK, RH);
    const tagK = spring(t - b(20.6), { freq: 3, damp: 0.55 });
    const tw = 168 * U, th = 48 * U;
    ctx.save(); ctx.translate(IX + 40 * U + tw / 2, yy - lift + 30 * U + th / 2); ctx.scale(tagK, tagK); ctx.translate(-tw / 2, -th / 2);
    ctx.fillStyle = GOLD; ctx.fillRect(0, 0, tw, th);
    txt('今日推荐', tw / 2, th / 2 + 9 * U, A(26 * U, 800), INK, 'center');
    ctx.restore();
    txt(c.bank, IX + 40 * U + tw + 24 * U, yy - lift + 66 * U, A(40 * U, 700), INK);
    txt(c.card, IX + 40 * U, yy - lift + 128 * U, A(28 * U, 500), INK3);
    const n = countUp(t, b(17) + 0.25 + i * 0.1, c.days, 0.6);
    const label = t < b(17) + 0.25 + i * 0.1 ? '--' : String(n);
    const kick = 1 + pulse(t, b(20), 0.3) * 0.05;
    ctx.save();
    ctx.translate(IX + IW - 36 * U, yy - lift + RH / 2 + 8 * U); ctx.scale(kick, kick);
    const fTian = A(44 * U, 600), fNum = A(128 * U, 800);
    ctx.font = fTian; const wT = ctx.measureText('天').width + 12 * U;
    txt('天', 0, 0, fTian, GOLD_DEEP, 'right', 'middle');
    txt(label, -wT, 0, fNum, GOLD_DEEP, 'right', 'middle');
    ctx.restore();
    txt('免息期', IX + IW - 36 * U, yy - lift + 52 * U, A(24 * U, 500), INK3, 'right');
  } else {
    ctx.fillStyle = SUNKEN; rr(IX, yy, IW, RH, 16 * U); ctx.fill();
    ctx.fillStyle = GREY_TAB; ctx.fillRect(IX, yy, 10 * U, RH);
    txt(c.bank, IX + 40 * U, yy + 72 * U, A(36 * U, 600), INK2);
    txt(c.card, IX + 40 * U, yy + 128 * U, A(26 * U, 400), INK3);
    const n = countUp(t, b(17) + 0.25 + i * 0.1, c.days, 0.6);
    const label = t < b(17) + 0.25 + i * 0.1 ? '--' : String(n);
    const fTian = A(38 * U, 500), fNum = A(96 * U, 800);
    ctx.font = fTian; const wT = ctx.measureText('天').width + 10 * U;
    txt('天', IX + IW - 36 * U, yy + RH / 2 + 8 * U, fTian, INK3, 'right', 'middle');
    txt(label, IX + IW - 36 * U - wT, yy + RH / 2 + 8 * U, fNum, INK2, 'right', 'middle');
    txt('免息期', IX + IW - 36 * U, yy + 52 * U, A(24 * U, 400), INK3, 'right');
  }
  ctx.restore();
}

function drawStrip(t, mini = false) {
  const k = mini ? 1 : snap(seg(t, b(20.8), b(21.6)));
  if (k <= 0) return;
  const sy = rowY(2) + RH + 52 * U;
  ctx.save(); ctx.globalAlpha = k;
  txt('距还款日 · 12 天', IX, sy, A(28 * U, 500), INK3);
  const cw = 24 * U, chh = 20 * U, cg = 10.4 * U;
  for (let i = 0; i < 20; i++) {
    const pop = mini ? 1 : spring(t - (b(21) + i * 0.05), { freq: 3, damp: 0.6 });
    const x = IX + i * (cw + cg), y = sy + 28 * U + (1 - pop) * 14 * U;
    ctx.fillStyle = i < 8 ? rgba(GOLD, 0.9) : i === 11 ? PERSIMMON : RULE;
    ctx.fillRect(x, y, cw * Math.max(pop, 0.01), chh * Math.max(pop, 0.01));
  }
  ctx.restore();
}

function drawApp(t, IMG) {
  const kIn = spring(t - b(7.6), { freq: 1.9, damp: 0.82 });
  const kOut = snap(seg(t, b(28), b(29.2)));
  const dy = (1 - kIn) * 520 * U - kOut * 520 * U;

  // ── 产品亮相文案 ──
  const kOutTop = snap(seg(t, b(15.5), b(16.5)));
  if (kOutTop < 1) {
    ctx.save(); ctx.translate(0, -kOutTop * 260 * U); ctx.globalAlpha = 1 - kOutTop;
    ctx.font = A(116 * U, 800);
    const wm = 'alocard';
    ctx.font = A(112 * U, 800);
    const wwm = ctx.measureText(wm).width;
    wipe(() => txt(wm, W / 2, 250 * U, A(112 * U, 800), GOLD_DEEP, 'center'), W / 2 - wwm / 2, 250 * U, wwm, snap(seg(t, b(8.4), b(9.4))));
    ctx.font = A(42 * U, 500);
    const tw = ctx.measureText('把账单日、还款日、免息期算清楚').width;
    wipe(() => txt('把账单日、还款日、免息期算清楚', W / 2, 348 * U, A(42 * U, 500), INK2, 'center'), W / 2 - tw / 2, 348 * U, tw, snap(seg(t, b(10), b(11.2))));
    ctx.restore();
  }
  if (t > b(15)) {
    const k = snap(seg(t, b(16.2), b(17.2)));
    ctx.font = A(56 * U, 700);
    const cw = ctx.measureText('免息期 · 按今天算').width;
    wipe(() => txt('免息期 · 按今天算', 72 * U, 268 * U, A(56 * U, 700), INK), 72 * U, 268 * U, cw, k);
  }

  // ── phone ──
  ctx.save();
  ctx.translate(0, dy);
  shadow(() => { ctx.fillStyle = RAISED; rr(PX, PY, PW, PH, PR); ctx.fill(); }, 60 * U, 24 * U, 'rgba(28,27,25,0.12)');
  ctx.strokeStyle = RULE; ctx.lineWidth = 1.5 * U; rr(PX, PY, PW, PH, PR); ctx.stroke();
  ctx.save(); rr(PX, PY, PW, PH, PR); ctx.clip();

  // 亮相段：真实首页截图（上滑退出）
  if (t < b(16.8)) {
    const kUp = snap(seg(t, b(15.6), b(16.8)));
    shotInPhone(IMG.home, 0, 190, 1200, 1552, IX, PY + 128 * U - kUp * 1100 * U, IW, 1040 * U, 12 * U);
    if (t < b(15.6)) {
      txt('AloCard', IX, PY + 92 * U, A(44 * U, 800), INK);
      txt('11 / 10', PX + PW - 48 * U, PY + 88 * U, A(30 * U, 600), INK3, 'right');
      ctx.strokeStyle = RULE; ctx.lineWidth = 1 * U;
      ctx.beginPath(); ctx.moveTo(IX, PY + 118 * U); ctx.lineTo(IX + IW, PY + 118 * U); ctx.stroke();
    }
  }
  if (t >= b(15.6)) {
    txt('AloCard', IX, PY + 92 * U, A(44 * U, 800), INK);
    txt('11 / 10', PX + PW - 48 * U, PY + 88 * U, A(30 * U, 600), INK3, 'right');
    ctx.strokeStyle = RULE; ctx.lineWidth = 1 * U;
    ctx.beginPath(); ctx.moveTo(IX, PY + 128 * U); ctx.lineTo(IX + IW, PY + 128 * U); ctx.stroke();
    const kLab = snap(seg(t, b(16), b(17)));
    ctx.fillStyle = GOLD; ctx.fillRect(IX, PY + 176 * U, 12 * U * kLab, 30 * U);
    if (kLab > 0.5) txt('按免息期排序', IX + 28 * U, PY + 202 * U, A(28 * U, 500), INK3);
    CARDS.forEach((c, i) => drawRow(c, i, t));
    drawStrip(t);
  }
  ctx.restore(); ctx.restore();

  // ── 卖点1 cursor + takeaway ──
  if (t > b(16.5) && t < b(28)) {
    const hotY = rowY(0);
    const kC = glide(seg(t, b(16.8), b(18.4)));
    const cx = lerp(IX + IW + 90 * U, IX + IW - 66 * U, kC) + Math.sin(t * 0.8) * 6 * U;
    const cy = lerp(PY + 400 * U, hotY + RH - 58 * U, kC);
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.35);
    ctx.fillStyle = INK; ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(0, 40 * U); ctx.lineTo(11 * U, 31 * U); ctx.lineTo(17 * U, 45 * U); ctx.lineTo(24 * U, 41 * U); ctx.lineTo(18 * U, 28 * U); ctx.lineTo(30 * U, 28 * U);
    ctx.closePath(); ctx.fill(); ctx.restore();
    ctx.strokeStyle = rgba(GOLD_DEEP, 0.55); ctx.lineWidth = 2 * U;
    ctx.beginPath(); ctx.arc(cx + 7 * U, cy + 15 * U, (26 + pulse(t, b(22), 0.35) * 10) * U, 0, TAU); ctx.stroke();
  }
  if (t > b(21.5)) {
    ctx.font = A(38 * U, 600);
    const kw = ctx.measureText('免息期按今天算，排序即答案。').width;
    wipe(() => txt('免息期按今天算，排序即答案。', W / 2, 1640 * U, A(38 * U, 600), INK2, 'center'), W / 2 - kw / 2, 1640 * U, kw, snap(seg(t, b(22), b(23.2))));
  }
}

// ═══ SELL-COUNT 14–20s · 账簿格带 hero ═══
function drawCount(t) {
  const kIn = snap(seg(t, b(28), b(29.5)));
  const kOut = snap(seg(t, b(40), b(41)));
  const dy = (1 - kIn) * 380 * U + kOut * 420 * U;
  ctx.save(); ctx.translate(0, dy);

  const filled = clamp(Math.ceil((t - b(28.5)) / BEAT), 0, 12);
  const n = 12 - filled;
  txt('距还款日', W / 2, 700 * U, A(48 * U, 700), INK2, 'center');
  ctx.save();
  ctx.translate(W / 2, 980 * U); ctx.scale(1 + pulse(t, Array.from({ length: 12 }, (_, i) => b(28.5) + i * BEAT), 0.14) * 0.05, 1);
  txt(String(n), 0, 0, A(280 * U, 800), n <= 2 ? PERSIMMON : GOLD_DEEP, 'center', 'middle');
  txt('天', 190 * U, 0, A(64 * U, 600), INK2, 'center', 'middle');
  ctx.restore();

  const cw = 64 * U, chh = 64 * U, cg = 12 * U, x0 = (W - (12 * cw + 11 * cg)) / 2, y0 = 1120 * U;
  for (let i = 0; i < 12; i++) {
    const x = x0 + i * (cw + cg);
    const pop = spring(t - (b(28.8) + i * 0.05), { freq: 3, damp: 0.6 });
    ctx.save(); ctx.translate(x + cw / 2, y0 + chh / 2); ctx.scale(Math.max(pop, 0.01), Math.max(pop, 0.01)); ctx.translate(-cw / 2, -chh / 2);
    if (i < filled) { ctx.fillStyle = i === 11 ? PERSIMMON : rgba(GOLD, 0.92); rr(0, 0, cw, chh, 8 * U); ctx.fill(); }
    else { ctx.strokeStyle = i === filled ? GOLD_DEEP : RULE; ctx.lineWidth = (i === filled ? 3 : 2) * U; rr(0, 0, cw, chh, 8 * U); ctx.stroke(); }
    if (i === 11) { const fl = pulse(t, b(39.5), 0.25); ctx.strokeStyle = rgba(PERSIMMON, 0.9); ctx.lineWidth = (3 + fl * 3) * U; rr(-6 * U * fl, -6 * U * fl, cw + 12 * U * fl, chh + 12 * U * fl, 10 * U); ctx.stroke(); }
    ctx.restore();
    if (i === filled && filled < 12) txt('今', x + cw / 2, y0 - 24 * U, A(30 * U, 700), GOLD_DEEP, 'center');
  }
  txt('一格一天，走到还款日。', W / 2, 1330 * U, A(40 * U, 500), INK3, 'center');
  ctx.restore();
}

// ═══ SELL-PRIV 20–24s · 真实锁屏 ═══
function drawPriv(t, IMG) {
  const kIn = spring(t - b(40.2), { freq: 1.9, damp: 0.82 });
  const kOut = snap(seg(t, b(48), b(49)));
  const dy = (1 - kIn) * 460 * U + kOut * 460 * U;
  const [sx, sy2] = shake(t, [b(44)], 5 * U, 0.2);
  ctx.save(); ctx.translate(sx, dy + sy2);
  shadow(() => { ctx.fillStyle = RAISED; rr(PX, PY, PW, PH, PR); ctx.fill(); }, 56 * U, 22 * U, 'rgba(28,27,25,0.12)');
  ctx.strokeStyle = RULE; ctx.lineWidth = 1.5 * U; rr(PX, PY, PW, PH, PR); ctx.stroke();
  shotInPhone(IMG.lock, 0, 190, 1200, 1552, IX, PY + 60 * U, IW, 1060 * U, 12 * U);
  // b44 锁合拢：金环脉冲落在截图锁图标位置
  const ring = pulse(t, b(44), 0.35);
  if (ring > 0.01) {
    ctx.strokeStyle = rgba(GOLD_DEEP, 0.75 * ring); ctx.lineWidth = 3 * U;
    ctx.beginPath(); ctx.arc(IX + IW / 2, PY + 60 * U + 1060 * U * ((355 - 190) / 1552), (52 + ring * 34) * U, 0, TAU); ctx.stroke();
  }
  ctx.restore();

  ctx.font = A(48 * U, 700);
  const capW = ctx.measureText('卡号，只存在这台手机里。').width;
  wipe(() => txt('卡号，只存在这台手机里。', W / 2, 1620 * U, A(48 * U, 700), INK2, 'center'), W / 2 - capW / 2, 1620 * U, capW, snap(seg(t, b(44.6), b(45.4))));
  txt('完整卡号 AES-256-GCM 加密存储 · 查看需 4 位安全密码 · 支持指纹解锁', W / 2, 1690 * U, A(24 * U, 400), INK3, 'center');
}

// ═══ RECAP 24–26s · 真实小组件（今日免息期）═══
function drawRecap(t, IMG) {
  const kIn = spring(t - b(48.2), { freq: 2, damp: 0.8 });
  const kOut = snap(seg(t, b(52), b(53)));
  const dy = (1 - kIn) * 300 * U + kOut * 300 * U;
  const dw = 600 * U, dh = dw * (518 / 450);
  const dx = (W - dw) / 2, dyy = 430 * U + dy;
  ctx.save();
  const pop = 1 + pulse(t, b(48.6), 0.3) * 0.02;
  ctx.translate(W / 2, dyy + dh / 2); ctx.scale(pop * (0.92 + 0.08 * kIn), pop * (0.92 + 0.08 * kIn)); ctx.translate(-W / 2, -(dyy + dh / 2));
  shadow(() => { ctx.drawImage(IMG.widgetToday, dx, dyy, dw, dh); }, 56 * U, 22 * U, 'rgba(28,27,25,0.3)');
  ctx.restore();
  const k = snap(seg(t, b(48.8), b(49.8)));
  ctx.font = A(56 * U, 800);
  const cw = ctx.measureText('一张卡的时间，都清楚了。').width;
  wipe(() => txt('一张卡的时间，都清楚了。', W / 2, 1330 * U, A(56 * U, 800), INK, 'center'), W / 2 - cw / 2, 1330 * U, cw, k);
  txt('最长免息 49 天 · 今日排序', W / 2, 1400 * U, A(28 * U, 500), INK3, 'center');
}

// ═══ ENDCARD 26–30s · 真实 logo ═══
function drawEndcard(t, IMG) {
  const kAll = spring(t - b(52.1), { freq: 2, damp: 0.8 });
  const lw = 660 * U, lh = lw * (724 / 2172);
  ctx.save();
  ctx.translate(W / 2, 830 * U + (1 - kAll) * 60 * U); ctx.scale(0.94 + 0.06 * kAll, 0.94 + 0.06 * kAll);
  ctx.drawImage(IMG.logo, -lw / 2, -lh / 2, lw, lh);
  ctx.restore();
  ctx.font = A(46 * U, 500);
  const tw = ctx.measureText('今天该刷哪张卡，一眼就懂。').width;
  wipe(() => txt('今天该刷哪张卡，一眼就懂。', W / 2, 1060 * U, A(46 * U, 500), INK2, 'center'), W / 2 - tw / 2, 1060 * U, tw, snap(seg(t, b(53), b(54))));
  ctx.font = A(32 * U, 700);
  const uw = ctx.measureText('github.com/alosir/AloCard').width;
  wipe(() => txt('github.com/alosir/AloCard', W / 2, 1160 * U, A(32 * U, 700), GOLD_DEEP, 'center'), W / 2 - uw / 2, 1160 * U, uw, snap(seg(t, b(53.4), b(54.2))));
}

const IMG = {
  home: await loadImage('assets/app-home.jpg'),
  lock: await loadImage('assets/app-lock.jpg'),
  widgetToday: await loadImage('assets/widget-today.png'),
  logo: await loadImage('assets/logo-gold.png'),
};

window.DUR = DUR;
window.render = t => {
  t = clamp(t, 0, DUR);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  dotGrid();
  const zoom = springTo(t, [[0, 1], [b(20), 1.05], [b(21.2), 1], [b(44), 1.02], [b(45), 1]], { freq: 3, damp: 0.85 });
  ctx.save(); camera(ctx, W, H, { zoom });
  if (t < b(8.5)) drawHook(t);
  if (t >= b(7.5) && t < b(29.2)) drawApp(t, IMG);
  if (t >= b(28) && t < b(41)) drawCount(t);
  if (t >= b(40) && t < b(49)) drawPriv(t, IMG);
  if (t >= b(48.2) && t < b(53.2)) drawRecap(t, IMG);
  if (t >= b(52)) drawEndcard(t, IMG);
  ctx.restore();
};

await loadFonts([
  A(280 * U, 800), A(128 * U, 800), A(112 * U, 800), A(108 * U, 800), A(96 * U, 800),
  A(72 * U, 800), A(64 * U, 800), A(64 * U, 600), A(56 * U, 800), A(56 * U, 700),
  A(48 * U, 700), A(46 * U, 500), A(44 * U, 600), A(44 * U, 800), A(42 * U, 500),
  A(40 * U, 700), A(40 * U, 500), A(38 * U, 600), A(38 * U, 500), A(36 * U, 700),
  A(36 * U, 600), A(32 * U, 800), A(32 * U, 600), A(30 * U, 700), A(30 * U, 500),
  A(28 * U, 500), A(26 * U, 500), A(26 * U, 400), A(24 * U, 500), A(24 * U, 400),
]);
window.render(0);
window.READY = true;
</script>
