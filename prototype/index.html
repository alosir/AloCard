<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AloCard · 交互原型</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="stage">

  <div class="stage__toolbar">
    <span class="stage__title">AloCard · 手账索引标签</span>
    <button data-theme-btn="light" aria-pressed="true">浅色</button>
    <button data-theme-btn="dark" aria-pressed="false">深色</button>
  </div>

  <!-- ============ 独立表面：桌面小组件与通知栏 ============ -->
  <section class="surfaces" aria-label="独立表面预览">
    <h2 class="surfaces__title">独立表面预览</h2>
    <p class="surfaces__note">桌面小组件与通知栏在真机上不位于 App 页面内，因此单独展示。</p>

    <div class="surfaces__row">
      <figure class="widget">
        <figcaption class="widget__head">
          <span class="widget__title">今日免息期</span>
          <span class="widget__date num">10/24</span>
        </figcaption>
        <div id="widget-rows"></div>
      </figure>

      <figure class="notification">
        <figcaption class="notification__head">
          <span class="notification__app">AloCard</span>
          <span class="notification__time num">10:24</span>
        </figcaption>
        <div id="notif-body"></div>
      </figure>
    </div>
  </section>

  <!-- ============ 应用界面 ============ -->
  <div class="devices">

    <!-- ---------- 首页 ---------- -->
    <figure class="device">
      <article class="panel screen" data-panel="home">
        <header class="topbar dot-grid">
          <h1 class="topbar__brand">AloCard</h1>
          <span class="topbar__date num">10 月 24 日 周六</span>
        </header>

        <div class="screen__body dot-grid">

          <div class="overview">
            <div class="overview__row">
              <div class="overview__metric">
                <span class="overview__label">已用额度</span>
                <span class="overview__value num" id="ov-used">—</span>
              </div>
              <div class="overview__metric" style="text-align:right">
                <span class="overview__label">剩余可用（估）</span>
                <span class="overview__value overview__value--muted num" id="ov-remain">—</span>
              </div>
            </div>
            <div class="meter"><div class="meter__fill" id="ov-meter"></div></div>
            <div class="overview__note">
              <span class="num" id="ov-limit">—</span>
              <span>· 仅统计已出账账单，未出账消费未计入</span>
            </div>
          </div>

          <button class="todo" data-close="todo-sheet">
            <span class="todo__dot"></span>
            <span>2 张卡待录入账单 · 1 张卡今天还款</span>
            <span class="todo__arrow" data-icon="chevron"></span>
          </button>

          <div class="segment" role="tablist" aria-label="排序方式">
            <button class="segment__item" role="tab" data-sort="due" aria-selected="false">距还款日</button>
            <button class="segment__item" role="tab" data-sort="grace" aria-selected="true">免息期</button>
          </div>

          <ul class="ledger" id="ledger"></ul>
        </div>

        <button class="fab" aria-label="新增卡片" data-open-add>
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>

        <nav class="navbar">
          <button class="navbar__item" aria-selected="true"><span data-icon="cards"></span>卡片</button>
          <button class="navbar__item" aria-selected="false"><span data-icon="gauge"></span>额度</button>
          <button class="navbar__item" aria-selected="false"><span data-icon="clock"></span>账单</button>
          <button class="navbar__item" aria-selected="false"><span data-icon="gear"></span>设置</button>
        </nav>

        <div class="sheet" id="bill-sheet" data-open="false">
          <div class="sheet__panel">
            <div class="sheet__grab"></div>
            <h2 class="sheet__title" id="bill-sheet-title">录入账单金额</h2>
            <p class="sheet__sub" id="bill-sheet-sub"></p>
            <div class="field">
              <label class="field__label" for="bill-amount">本期账单金额</label>
              <input class="field__input field__input--num" id="bill-amount" type="number" inputmode="decimal" placeholder="0.00">
              <p class="field__hint">录入后可在卡片详情中随时修改，重复录入为覆盖而非累加。</p>
            </div>
            <div class="sheet__actions">
              <button class="btn btn--tonal" data-close="bill-sheet">取消</button>
              <button class="btn btn--filled" data-close="bill-sheet">保存</button>
            </div>
          </div>
        </div>

        <div class="sheet" id="pay-sheet" data-open="false">
          <div class="sheet__panel">
            <div class="sheet__grab"></div>
            <h2 class="sheet__title" id="pay-sheet-title">标记还款</h2>
            <p class="sheet__sub" id="pay-sheet-sub"></p>
            <div class="field">
              <label class="field__label" for="pay-amount">本次还款金额</label>
              <input class="field__input field__input--num" id="pay-amount" type="number" inputmode="decimal">
              <p class="field__hint">可标记部分或全部；多次标记为累计。标记后可用额度即时释放。</p>
            </div>
            <div class="sheet__actions">
              <button class="btn btn--tonal" data-close="pay-sheet">取消</button>
              <button class="btn btn--filled" data-close="pay-sheet">确认标记</button>
            </div>
          </div>
        </div>

        <div class="sheet" id="todo-sheet" data-open="false">
          <div class="sheet__panel">
            <div class="sheet__grab"></div>
            <h2 class="sheet__title">待办</h2>
            <p class="sheet__sub">需要你处理的两类事情</p>
            <div class="todo__list">
              <div class="kv">
                <span class="kv__key"><span class="badge-dot"></span> 工商银行 · 2251</span>
                <span class="kv__val" style="color:var(--state-due)">待录入账单</span>
              </div>
              <div class="kv">
                <span class="kv__key">招商银行 · 6688</span>
                <span class="kv__val" style="color:var(--state-due)">今天还款</span>
              </div>
            </div>
            <button class="btn btn--filled" style="width:100%;margin-top:var(--sp-4)" data-close="todo-sheet">知道了</button>
          </div>
        </div>
      </article>
    </figure>

    <!-- ---------- 卡片详情 ---------- -->
    <!-- ---------- 卡片详情 ---------- -->
    <figure class="device">
      <article class="panel screen" data-panel="detail">
        <header class="topbar dot-grid">
          <button class="btn btn--text btn--icon" aria-label="返回">
            <svg class="icon" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <h1 class="topbar__brand" style="font-size:var(--t-body)">招商银行 · 日常消费卡</h1>
          <span class="topbar__date num">尾号 6688</span>
        </header>

        <div class="screen__body dot-grid">

          <div class="section section--flush">
            <div class="row__body" style="margin:0">
              <span class="row__grace">
                <span class="row__grace-value num" style="font-size:44px">49</span>
                <span class="row__grace-unit">天免息</span>
              </span>
              <span class="row__due">
                <span class="row__due-text row__due-text--due">今天还款</span>
                <span class="row__due-sub num">待还 ¥5,320</span>
              </span>
            </div>
            <div class="countdown" id="detail-countdown" style="margin-top:var(--sp-4)"></div>
            <div class="countdown__caption num" id="detail-countdown-caption"></div>
            <div class="countdown__legend">
              <span><i class="countdown__swatch countdown__swatch--past"></i>已过</span>
              <span><i class="countdown__swatch countdown__swatch--today"></i>今天</span>
              <span><i class="countdown__swatch countdown__swatch--due"></i>还款日</span>
            </div>
          </div>

          <div class="section">
            <h2 class="section__title">额度</h2>
            <div class="overview__row" style="margin-bottom:var(--sp-3)">
              <div class="overview__metric">
                <span class="overview__label">已用</span>
                <span class="overview__value num">¥6,170</span>
              </div>
              <div class="overview__metric" style="text-align:right">
                <span class="overview__label">剩余（估）</span>
                <span class="overview__value overview__value--muted num">¥43,830</span>
              </div>
            </div>
            <div class="meter"><div class="meter__fill" style="width:12.34%"></div></div>
            <div class="overview__note"><span class="num">授信额度 ¥50,000</span><span>· 已用 12.34%</span></div>
            <p class="field__hint" style="margin-top:var(--sp-3)">剩余可用为估算值，仅统计已出账账单；未出账消费未计入。</p>
          </div>

          <div class="section">
            <h2 class="section__title">账期</h2>
            <div class="kv"><span class="kv__key">账单日</span><span class="kv__val num">每月 5 号</span></div>
            <div class="kv"><span class="kv__key">最后还款日</span><span class="kv__val num">每月 25 号（推后 20 天）</span></div>
            <div class="kv"><span class="kv__key">本期账单日</span><span class="kv__val num">10 月 5 日</span></div>
            <div class="kv"><span class="kv__key">下期账单日</span><span class="kv__val num">11 月 5 日</span></div>
          </div>

          <div class="section">
            <h2 class="section__title">本期账单</h2>
            <div class="kv"><span class="kv__key">账单金额</span><span class="kv__val num">¥8,320</span></div>
            <div class="kv"><span class="kv__key">已还款</span><span class="kv__val num">¥3,000</span></div>
            <div class="kv"><span class="kv__key">待还金额</span><span class="kv__val num" style="color:var(--state-due)">¥5,320</span></div>
            <div class="kv"><span class="kv__key">状态</span><span class="kv__val">部分还款</span></div>
          </div>

          <div class="section">
            <h2 class="section__title">卡片</h2>
            <div class="kv">
              <span class="kv__key">卡号</span>
              <span class="kv__val">
                <span class="masked" id="masked-num">
                  <span id="masked-text">•••• •••• •••• 6688</span>
                  <button class="masked__reveal" id="reveal-btn" aria-label="查看完整卡号">
                    <svg class="icon icon--sm" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </span>
              </span>
            </div>
            <div class="kv"><span class="kv__key">有效期</span><span class="kv__val num">2029-06</span></div>
            <div class="kv"><span class="kv__key">卡组织</span><span class="kv__val">中国银联</span></div>
            <div class="kv"><span class="kv__key">共享账单</span><span class="kv__val">招商银行 · 2 张卡</span></div>
          </div>

          <div class="section section--actions">
            <button class="btn btn--tonal" data-open-bill>录入账单金额</button>
            <button class="btn btn--filled" data-open-pay>标记还款</button>
          </div>
        </div>
      </article>
    </figure>

    <!-- ---------- 新增卡片 ---------- -->
    <figure class="device">
      <article class="panel screen" data-panel="add">
        <header class="topbar dot-grid">
          <button class="btn btn--text btn--icon" aria-label="返回">
            <svg class="icon" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <h1 class="topbar__brand" style="font-size:var(--t-body)">新增卡片</h1>
        </header>

        <div class="screen__body dot-grid screen__body--form">
          <div class="steps">
            <span class="steps__label">第 1 步 · 卡片信息</span>
            <span class="steps__bar"><span class="steps__fill" style="width:50%"></span></span>
            <span class="steps__count num">1/2</span>
          </div>

          <div class="section section--flush">
            <h2 class="section__title">这张卡共享账单吗</h2>
            <button class="choice" aria-pressed="true">
              <span class="choice__mark"></span>
              <span class="choice__body">
                <span class="choice__title">新建账单组</span>
                <span class="choice__meta">这张卡独立出账，单独设置账期与额度</span>
              </span>
            </button>
            <button class="choice" aria-pressed="false">
              <span class="choice__mark"></span>
              <span class="choice__body">
                <span class="choice__title">加入已有账单组</span>
                <span class="choice__meta">招商银行 · 账单日 5 号 · 额度 ¥50,000</span>
              </span>
            </button>
          </div>

          <div class="section section--flush">
            <h2 class="section__title">卡片信息</h2>

            <div class="field">
              <label class="field__label" for="card-no">卡号</label>
              <input class="field__input field__input--num" id="card-no" type="text" inputmode="numeric" placeholder="选填，填完整卡号可自动识别银行与卡组织">
              <p class="field__hint">卡号在本地加密存储，界面默认只显示末 4 位。</p>
            </div>

            <div class="field">
              <label class="field__label" for="card-name">卡名称</label>
              <input class="field__input" id="card-name" type="text" placeholder="选填，如「日常消费卡」">
            </div>

            <div class="field">
              <label class="field__label" for="card-exp">有效期</label>
              <input class="field__input field__input--num" id="card-exp" type="text" placeholder="YYYY-MM">
              <p class="field__hint">到期前 30 天会提醒换卡。</p>
            </div>
          </div>

          <div class="section section--flush">
            <h2 class="section__title">账期与额度</h2>

            <div class="field">
              <label class="field__label" for="bill-day">账单日</label>
              <input class="field__input field__input--num" id="bill-day" type="number" min="1" max="28" placeholder="1–28">
              <p class="field__hint">银行实际账单日只在 1–28 号之间。</p>
            </div>

            <div class="field">
              <label class="field__label">最后还款日</label>
              <div class="stepper" id="offset-stepper">
                <button class="stepper__btn" data-step="-1" aria-label="减少一天">−</button>
                <span class="stepper__value num" id="offset-value">20</span>
                <button class="stepper__btn" data-step="1" aria-label="增加一天">+</button>
              </div>
              <p class="field__hint" id="offset-preview">账单日 5 号 → 还款日 25 号</p>
            </div>

            <div class="field">
              <label class="field__label" for="limit">信用额度</label>
              <input class="field__input field__input--num" id="limit" type="number" inputmode="decimal" placeholder="0.00">
              <p class="field__hint">用于汇总总授信、已用与剩余可用额度。</p>
            </div>
          </div>

          <button class="btn btn--filled" style="width:100%;margin:var(--sp-4) var(--sp-4) 0" data-open-pin>保存卡片</button>
          <p class="field__hint" style="text-align:center;margin-top:var(--sp-3)">
            账单日、还款日与额度可稍后补充，补全前该卡显示为「待完善」。
          </p>
        </div>
      </article>
    </figure>

    <!-- ---------- 安全密码 ---------- -->
    <figure class="device">
      <article class="panel screen" data-panel="pin">
        <header class="topbar dot-grid">
          <h1 class="topbar__brand" style="font-size:var(--t-body)">设置安全密码</h1>
        </header>
        <div class="screen__body dot-grid" style="padding:var(--sp-4)">
          <div class="empty" style="padding-top:var(--sp-6)">
            <div class="empty__head">
              <span class="empty__mark">
                <svg class="icon" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
              </span>
              <h2 class="empty__title">用 6 位数字保护卡号</h2>
            </div>
            <p class="empty__text">
              查看或复制完整卡号时会要求输入。密码仅保存在本机，无法找回。
            </p>
          </div>

          <div class="pin">
            <span class="pin__cell pin__cell--active"></span>
            <span class="pin__cell"></span>
            <span class="pin__cell"></span>
            <span class="pin__cell"></span>
            <span class="pin__cell"></span>
            <span class="pin__cell"></span>
          </div>

          <p id="pin-hint" class="field__hint" style="text-align:center;margin-bottom:var(--sp-4)">尚未设置</p>

          <div class="keypad">
            <button class="keypad__key pin__key" data-key="1">1</button>
            <button class="keypad__key pin__key" data-key="2">2</button>
            <button class="keypad__key pin__key" data-key="3">3</button>
            <button class="keypad__key pin__key" data-key="4">4</button>
            <button class="keypad__key pin__key" data-key="5">5</button>
            <button class="keypad__key pin__key" data-key="6">6</button>
            <button class="keypad__key pin__key" data-key="7">7</button>
            <button class="keypad__key pin__key" data-key="8">8</button>
            <button class="keypad__key pin__key" data-key="9">9</button>
            <button class="keypad__key pin__key" data-key="del">退格</button>
            <button class="keypad__key pin__key" data-key="0">0</button>
            <button class="keypad__key" disabled>确定</button>
          </div>
        </div>
      </article>
    </figure>

    <!-- ---------- 空状态 ---------- -->
    <figure class="device">
      <article class="panel screen" data-panel="empty">
        <header class="topbar dot-grid">
          <h1 class="topbar__brand">AloCard</h1>
          <span class="topbar__date num">10 月 24 日 周六</span>
        </header>
        <div class="screen__body dot-grid">
          <div class="empty">
            <div class="empty__head">
              <span class="empty__mark">
                <svg class="icon" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="13" rx="2"/><path d="M2.5 10h19"/><path d="M6 6V4.5A1.5 1.5 0 0 1 7.5 3h11"/></svg>
              </span>
              <h2 class="empty__title">还没有卡片</h2>
            </div>
            <p class="empty__text">
              加一张信用卡，AloCard 会算出它距离下次出账还有几天、免息期有多少天。
            </p>
            <button class="btn btn--filled">添加第一张卡</button>
          </div>
        </div>
        <nav class="navbar">
          <button class="navbar__item" aria-selected="true"><span data-icon="cards"></span>卡片</button>
          <button class="navbar__item" aria-selected="false"><span data-icon="gauge"></span>额度</button>
          <button class="navbar__item" aria-selected="false"><span data-icon="clock"></span>账单</button>
          <button class="navbar__item" aria-selected="false"><span data-icon="gear"></span>设置</button>
        </nav>
      </article>
    </figure>

  </div>
</div>

<script src="../engine/dateEngine.js"></script>
<script src="app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const map = {
    cards: `<svg class="icon" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="13" rx="2"/><path d="M2.5 10h19"/><path d="M6 6V4.5A1.5 1.5 0 0 1 7.5 3h11"/></svg>`,
    gauge: `<svg class="icon" viewBox="0 0 24 24"><path d="M20.5 16a9 9 0 1 0-17 0"/><path d="M12 13l4-4"/><circle cx="12" cy="13" r="1.4"/></svg>`,
    clock: `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>`,
    gear: `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>`,
    chevron: `<svg class="icon icon--sm" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>`,
  };
  document.querySelectorAll('[data-icon]').forEach((el) => {
    el.innerHTML = map[el.dataset.icon] || '';
  });

  // 弹层：按设备作用域绑定
  document.querySelectorAll('.device').forEach((dev) => {
    dev.querySelectorAll('[data-close]').forEach((b) => {
      b.addEventListener('click', () => {
        const t = dev.querySelector('#' + b.dataset.close);
        if (t) t.dataset.open = 'false';
      });
    });
    dev.querySelectorAll('.sheet').forEach((s) => {
      s.addEventListener('click', (ev) => {
        if (ev.target === s) s.dataset.open = 'false';
      });
    });
    dev.querySelector('[data-open-bill]')?.addEventListener('click', () => {
      dev.querySelector('#bill-sheet')?.setAttribute('data-open', 'true');
    });
    dev.querySelector('[data-open-pay]')?.addEventListener('click', () => {
      dev.querySelector('#pay-sheet')?.setAttribute('data-open', 'true');
    });
    dev.querySelectorAll('.choice').forEach((c) => {
      c.addEventListener('click', () => {
        c.parentElement.querySelectorAll('.choice').forEach((x) =>
          x.setAttribute('aria-pressed', String(x === c))
        );
      });
    });
  });

  // 完整卡号查看
  const revealBtn = document.getElementById('reveal-btn');
  const maskedText = document.getElementById('masked-text');
  revealBtn?.addEventListener('click', () => {
    const masked = maskedText.textContent.includes('•');
    maskedText.textContent = masked ? '6217 8512 8846 6688' : '•••• •••• •••• 6688';
    maskedText.style.letterSpacing = masked ? '0.02em' : '0.06em';
  });

  // 跳转：新增卡片 / 安全密码（跨屏滚动定位）
  const scrollTo = (panel) => {
    document.querySelector(`.device [data-panel="${panel}"]`)
      ?.closest('.device')
      ?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
  document.querySelector('[data-open-add]')?.addEventListener('click', () => scrollTo('add'));
  document.querySelector('[data-open-pin]')?.addEventListener('click', () => scrollTo('pin'));
});
</script>
</body>
</html>
