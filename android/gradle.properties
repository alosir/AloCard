org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 工程路径含中文（华为家庭存储同步盘）。纯 Kotlin/Compose 构建无 native 代码，
# 实测可用；若未来引入 NDK 需迁移到纯 ASCII 路径。
android.overridePathCheck=true

# ---- 版本号（单一事实来源；scripts/release.sh 发版时更新）----
# 规则见 CHANGELOG.md 文件头：三段式 v主.次.修订；versionCode 每次发布递增
alocard.versionName=1.0.0
alocard.versionCode=1
