org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# 构建输出已重定向到本机用户目录（NAS 同步盘会损坏构建产物，见 app/build.gradle.kts）
# 本机内存紧张时：可追加 -XX:+UseParallelGC 或 -Palocard.minify=false 降低构建峰值
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 工程路径含中文（华为家庭存储同步盘）。纯 Kotlin/Compose 构建无 native 代码，
# 实测可用；若未来引入 NDK 需迁移到纯 ASCII 路径。
android.overridePathCheck=true

# ---- 版本号（单一事实来源；scripts/release.sh 发版时更新）----
# 规则见 CHANGELOG.md 文件头：三段式 v主.次.修订；versionCode 每次发布递增
alocard.versionName=0.0.9
alocard.versionCode=9
